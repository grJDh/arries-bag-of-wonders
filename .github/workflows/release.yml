name: Release module

# Релиз создаётся сам: при каждом слиянии в main workflow смотрит на version в module.json
# и, если релиза с таким номером ещё нет, собирает module.zip и публикует его.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          VERSION=$(jq -r .version module.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.v.outputs.tag }} already exists, nothing to do."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set links for this version
        if: steps.exists.outputs.found == 'false'
        env:
          TAG: ${{ steps.v.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          jq --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.manifest=$manifest | .download=$download' module.json > module.tmp
          mv module.tmp module.json
          cat module.json

      - name: Build module.zip
        if: steps.exists.outputs.found == 'false'
        run: zip -r module.zip module.json README.md scripts templates styles

      - name: Publish release
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" module.json module.zip \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
